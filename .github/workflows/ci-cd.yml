name: GuardianOC CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-test:
    name: Backend Lint & ML Verification
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: "pip"

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Verify ML & CRQ Engines
      run: |
        python -c "from engine.crq_engine import CRQEngine; from engine.ml_models import BreachPredictorML, AttackGraphAnalyzerML, RiskForecasterML; crq = CRQEngine(); print('CRQ simulation valid'); rf = BreachPredictorML(); print('RandomForest initialized'); graph = AttackGraphAnalyzerML(); print('Attack graph initialized'); fc = RiskForecasterML(); print('Risk forecaster initialized')"

  frontend-build:
    name: Frontend Next.js Production Build
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: "npm"
        cache-dependency-path: frontend/package.json

    - name: Install Frontend Dependencies
      working-directory: ./frontend
      run: npm install

    - name: Build Next.js Production Bundle
      working-directory: ./frontend
      run: npm run build
      env:
        NEXT_TELEMETRY_DISABLED: 1
        NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
