version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: guardianoc-prod-backend
    restart: always
    environment:
      - PORT=8000
      - ENVIRONMENT=production
      - PYTHONUNBUFFERED=1
    ports:
      - "8000:8000"
      - "10000:10000/udp"
    networks:
      - guardianoc-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: guardianoc-prod-frontend
    restart: always
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - guardianoc-net

  nginx:
    image: nginx:alpine
    container_name: guardianoc-prod-proxy
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - guardianoc-net

  redis:
    image: redis:7-alpine
    container_name: guardianoc-prod-cache
    restart: always
    ports:
      - "6379:6379"
    networks:
      - guardianoc-net

networks:
  guardianoc-net:
    driver: bridge
